name: auto-time-report

# База лежит в ./data на хосте: локальный запуск и Docker работают с одним и тем же файлом.
# Контейнеры запускаются под твоим UID/GID, чтобы файлы в ./data и db/migrations принадлежали тебе
x-user: &user "${UID:-1000}:${GID:-1000}"

# Общее для долгоживущих контейнеров: read-only ФС, без capability, без core dump, логи с ротацией
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  ulimits:
    core: 0
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"
  restart: unless-stopped

services:
  # Накатывает миграции и завершается; бот стартует только после успешного наката.
  # Через него же работают make migrate-*, поэтому ставить dbmate локально не нужно
  migrate:
    image: ghcr.io/amacneil/dbmate:2.26.0
    user: *user
    environment:
      DATABASE_URL: sqlite:/data/bot.db
      DBMATE_MIGRATIONS_DIR: /db/migrations
      # Для SQLite dump схемы требует утилиту sqlite3, а нам он не нужен
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db/migrations:/db/migrations
      - ./data:/data
    command: ["up"]

  # OpenVPN по запросу бота. Root нужен iproute2 (он сбрасывает capability у не-root), но из capability
  # только NET_ADMIN, туннель живёт в сетевом пространстве этого контейнера и бота
  vpn:
    <<: *hardening
    build: ./docker/vpn
    # Root без CAP_DAC_OVERRIDE работает с файлами через группу бота: так он читает конфиг, а бот — сокет
    user: "0:${GID:-1000}"
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_RUN_DIR: /run/vpn
      VPN_DEBUG: "${VPN_DEBUG:-0}"
    volumes:
      - vpn-run:/run/vpn
    tmpfs:
      - /tmp

  bot:
    <<: *hardening
    build: .
    user: *user
    # Сеть sidecar'а: через туннель бот ходит в Jira, остальной трафик идёт как обычно
    network_mode: "service:vpn"
    env_file:
      - path: .env
        required: true
        # Значения как есть, без подстановки ${...}
        format: raw
    environment:
      # Пути внутри контейнера перекрывают локальные из .env
      DATABASE_URL: sqlite:/data/bot.db
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      CREDS_FILE: /run/secrets/creds
      VPN_RUN_DIR: /run/vpn
    secrets:
      - telegram_bot_token
      - creds
    volumes:
      - ./data:/data
      - vpn-run:/run/vpn
    tmpfs:
      - /tmp
    depends_on:
      migrate:
        condition: service_completed_successfully
      vpn:
        condition: service_started

# Без swarm это bind-mount файлов: права берутся с хоста, держи их 0400 и своими (make secrets)
secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  creds:
    file: ./secrets/creds.age

volumes:
  # Общий каталог бота и sidecar'а в памяти: временный конфиг OpenVPN и management-сокет на диск не попадают
  vpn-run:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=${UID:-1000},gid=${GID:-1000},mode=0770,size=1m"
